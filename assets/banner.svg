<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; border-radius:16px; overflow:hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="neonPulse" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Dynamic Logistics Flow Animations */
    @keyframes dashMove {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.3); opacity: 1; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatPillReverse {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    @keyframes beamSweep {
      0% { transform: translateX(-400px); opacity: 0.1; }
      50% { opacity: 0.8; }
      100% { transform: translateX(1200px); opacity: 0.1; }
    }

    .flow-line {
      stroke-dasharray: 8 12;
      animation: dashMove 14s linear infinite;
    }
    .flow-line-fast {
      stroke-dasharray: 6 10;
      animation: dashMove 8s linear infinite reverse;
    }
    .pulse-node {
      animation: pulseOrb 3.5s ease-in-out infinite;
      transform-origin: center;
    }
    .pill-1 { animation: floatPill 5s ease-in-out infinite; }
    .pill-2 { animation: floatPillReverse 6s ease-in-out infinite; }
    .pill-3 { animation: floatPill 5.5s ease-in-out infinite 1s; }
    .pill-4 { animation: floatPillReverse 6.5s ease-in-out infinite 0.5s; }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGlow)" />

  <!-- Subtle Blueprint / Grid Lines in Background -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Glowing Background Orbs -->
  <circle cx="200" cy="80" r="140" fill="#38bdf8" opacity="0.06" filter="url(#neonPulse)" />
  <circle cx="1020" cy="280" r="160" fill="#a855f7" opacity="0.08" filter="url(#neonPulse)" />
  <circle cx="900" cy="90" r="120" fill="#6366f1" opacity="0.07" filter="url(#neonPulse)" />

  <!-- Dynamic Multi-Carrier Logistics Route Curves (Placed firmly in background) -->
  <g opacity="0.45">
    <path class="flow-line" d="M -50,290 C 250,330 450,210 700,280 C 950,340 1050,240 1250,290" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" />
    <path class="flow-line-fast" d="M -50,90 C 220,40 500,160 800,70 C 1020,0 1100,130 1250,70" fill="none" stroke="#38bdf8" stroke-width="1.8" />
    <path class="flow-line" d="M -50,190 C 350,110 700,260 1250,160" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 8" />
  </g>

  <!-- Background Animated Carrier Status Pills (Layered safely around periphery) -->
  <!-- Top Right: Real-time Multi-Carrier Rates -->
  <g class="pill-1" transform="translate(870, 36)">
    <rect width="270" height="42" rx="21" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="24" cy="21" r="5" fill="#10b981" class="pulse-node" />
    <text x="38" y="26" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="0.5">MULTI-CARRIER RATE ENGINE</text>
    <rect x="215" y="12" width="42" height="18" rx="9" fill="#10b981" fill-opacity="0.2" />
    <text x="236" y="24" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">LIVE</text>
  </g>

  <!-- Bottom Right: Label Generation & Tracking -->
  <g class="pill-2" transform="translate(840, 275)">
    <rect width="300" height="46" rx="23" fill="url(#cardBg)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="26" cy="23" r="6" fill="#818cf8" />
    <text x="44" y="23" fill="#f8fafc" font-size="13" font-weight="600">Automated Dispatch &amp; Tracking</text>
    <text x="44" y="37" fill="#64748b" font-size="11">USPS • FedEx • UPS • DHL • Regional</text>
  </g>

  <!-- Top Left Indicator: Headless & API-First -->
  <g class="pill-3" transform="translate(70, 34)">
    <rect width="210" height="34" rx="17" fill="url(#cardBg)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.3" />
    <circle cx="18" cy="17" r="4" fill="#c084fc" class="pulse-node" />
    <text x="32" y="22" fill="#cbd5e1" font-size="11.5" font-weight="600" letter-spacing="0.3">⚡ Headless Logistics API</text>
  </g>

  <!-- Bottom Left Indicator: 100% Carrier Abstraction -->
  <g class="pill-4" transform="translate(70, 280)">
    <rect width="230" height="36" rx="18" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
    <text x="18" y="23" fill="#38bdf8" font-size="13">📦</text>
    <text x="38" y="23" fill="#cbd5e1" font-size="11.5" font-weight="500">Universal Carrier Abstraction</text>
  </g>

  <!-- FOREGROUND: Main Title, Badge & Subtitle (Guaranteed 100% visible and uncluttered) -->
  <!-- Category Pill -->
  <g transform="translate(100, 102)">
    <rect width="230" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" />
    <text x="115" y="18" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1.2" text-anchor="middle">AWESOME LOGISTICS STACK</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="174" fill="#ffffff" font-size="38" font-weight="800" letter-spacing="-0.8">
    Multi-Carrier Shipping <tspan fill="url(#accentGrad)">&amp; Fulfillment</tspan>
  </text>

  <!-- Subtitle -->
  <text x="100" y="214" fill="#94a3b8" font-size="16.5" font-weight="400" letter-spacing="0.2">
    Enterprise SaaS Platforms • Headless APIs • Open-Source Logistics Engines
  </text>

  <!-- Feature Highlights Row in Foreground -->
  <g transform="translate(100, 238)">
    <text x="0" y="0" fill="#64748b" font-size="13" font-weight="500">
      <tspan fill="#38bdf8">✓</tspan> Real-Time Rates    
      <tspan dx="15" fill="#818cf8">✓</tspan> Label Generation    
      <tspan dx="15" fill="#a855f7">✓</tspan> Multi-Carrier Tracking    
      <tspan dx="15" fill="#34d399">✓</tspan> Address Verification
    </text>
  </g>

  <!-- Outer Border -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.4" />
</svg>
